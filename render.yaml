# Blueprint do Render (alternativa ao Railway). Variáveis secretas são preenchidas no painel do Render.
services:
  - type: web
    name: clickju-site
    runtime: docker
    plan: starter
    healthCheckPath: /robots.txt
    preDeployCommand: npm run db:migrate
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: APP_URL
        sync: false
      - key: APP_SECRET
        generateValue: true
      - key: STORAGE_DRIVER
        value: s3
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_BUCKET
        value: fotografias
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_FORCE_PATH_STYLE
        value: "true"
      - key: ADMIN_EMAIL
        value: clickjuu@gmail.com
      - key: NOTIFY_EMAIL
        value: clickjuu@gmail.com
